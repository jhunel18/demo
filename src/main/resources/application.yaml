server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:classpath:application-secrets.yaml

  application:
    name: demo

  # ── MySQL Database (falls back to local MySQL if no secrets file) ──
  datasource:
    url: ${db.url:jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${db.username:root}
    password: ${db.password:}

  # ── JPA / Hibernate ──────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  # ── Multipart File Upload Limits ──────────────────────────────
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
